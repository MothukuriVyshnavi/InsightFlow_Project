<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile | InsightFlow</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/hero.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>Insight</span>Flow
    </div>

    <nav class="nav-links">

        <a href="../index.html">
            Home
        </a>

        <a href="analyze.html">
            Analyze
        </a>

        <a href="login.html">
            Login / Sign Up
        </a>

        <a href="profile.html">
            Profile
        </a>

    </nav>

</header>


<main>

    <section class="profile-page">

        <h1>
            My InsightFlow Profile
        </h1>

        <div class="profile-card">

            <div class="profile-avatar">
                👤
            </div>

            <h2 id="profileName">
                User
            </h2>

            <p id="profileEmail">
                user@example.com
            </p>

            <div class="profile-stats">

                <div>
                    <strong>0</strong>
                    <span>Datasets</span>
                </div>

                <div>
                    <strong>0</strong>
                    <span>Analyses</span>
                </div>

            </div>

            <button id="logoutBtn">
                Logout
            </button>

        </div>

    </section>

</main>

</body>

</html>
