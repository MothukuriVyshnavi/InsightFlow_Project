<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Analyze Data | InsightFlow</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/hero.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>Insight</span>Flow
    </div>

    <nav class="nav-links">

        <a href="../index.html"
           class="nav-link">
            Home
        </a>

        <a href="analyze.html"
           class="nav-link active">
            Analyze
        </a>

        <a href="login.html"
           class="nav-link">
            Login / Sign Up
        </a>

        <a href="profile.html"
           class="nav-link">
            Profile
        </a>

    </nav>

</header>


<main>

    <section class="analyze-page">

        <h1>
            Analyze Your Data
        </h1>

        <p>
            Upload your dataset and let InsightFlow
            discover meaningful insights.
        </p>

        <div class="upload-box">

            <h2>
                Upload Dataset
            </h2>

            <p>
                Supported format: CSV
            </p>

            <input
                type="file"
                id="csvFile"
                accept=".csv"
            >

            <button id="analyzeBtn">
                Analyze Dataset
            </button>

        </div>

    </section>

</main>


<script src="../js/navigation.js"></script>

</body>

</html>
