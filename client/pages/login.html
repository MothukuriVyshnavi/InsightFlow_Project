<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | InsightFlow</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>Insight</span>Flow
    </div>

    <nav class="nav-links">

        <a href="../index.html">
            Home
        </a>

        <a href="analyze.html">
            Analyze
        </a>

        <a href="login.html">
            Login / Sign Up
        </a>

        <a href="profile.html">
            Profile
        </a>

    </nav>

</header>


<main>

    <div class="auth-container">

        <h1>
            Welcome to InsightFlow
        </h1>

        <p>
            Login to analyze your datasets
            and access your insights.
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="signup.html">
                Sign Up
            </a>
        </p>

    </div>

</main>

</body>

</html>
