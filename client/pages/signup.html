<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up | InsightFlow</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>Insight</span>Flow
    </div>
</header>


<main>

    <div class="auth-container">

        <h1>
            Create Your InsightFlow Account
        </h1>

        <p>
            Create an account to analyze datasets
            and save your analysis history.
        </p>

        <form id="signupForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?
            <a href="login.html">
                Login
            </a>
        </p>

    </div>

</main>

</body>

</html>
